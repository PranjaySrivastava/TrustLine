name: Frontend Dashboard Tests

on:
  pull_request:
    paths:
      - "dashboard/**"
      - "tests/frontend/**"
      - ".github/workflows/frontend-tests.yml"
  push:
    branches: [ main ]
    paths:
      - "dashboard/**"
      - "tests/frontend/**"
  workflow_dispatch:

jobs:
  test-frontend:
    name: Dashboard Asset & Integrity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Verify Dashboard HTML/JS/CSS Files Exist
        run: |
          echo "Verifying dashboard core assets..."
          test -f dashboard/index.html || exit 1
          echo "Frontend entrypoint index.html is valid."

      - name: Run Frontend Pytest Suite
        run: |
          pytest tests/frontend/ -v
