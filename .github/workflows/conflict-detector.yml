name: PR Merge Conflict Detector

on:
  push:
    branches: [ main ]
  pull_request_target:
    types: [synchronize, opened, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  check-conflicts:
    name: Check for PR Merge Conflicts
    runs-on: ubuntu-latest
    steps:
      - name: Detect Merge Conflicts
        uses: eps1lon/actions-label-merge-conflicts@v3
        with:
          dirtyLabel: "has-conflicts"
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          commentOnDirty: "⚠️ **Merge Conflict Alert:** Recent changes on `main` conflict with this branch. Please rebase or merge `main` into your feature branch before requesting review."
          commentOnClean: "✅ **Conflict Resolved:** This branch can now be merged cleanly into `main`."
