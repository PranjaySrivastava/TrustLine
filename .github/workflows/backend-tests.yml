name: Backend Tests & Gateway Validation

on:
  pull_request:
    paths:
      - "gateway/**"
      - "adapters/**"
      - "tests/backend/**"
      - "requirements.txt"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [ main ]
    paths:
      - "gateway/**"
      - "adapters/**"
      - "tests/backend/**"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  test-backend:
    name: Backend Pytest & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Gateway & Adapters (Flake8)
        run: |
          flake8 gateway adapters tests/backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Backend Pytest Suite
        env:
          FIREWALL_ENV: "testing"
          FAIL_CLOSED: "true"
        run: |
          pytest tests/backend/ -v
