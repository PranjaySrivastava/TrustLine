name: CD - Main Pipeline & Release Validation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Production Build Verification & Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Integrity & Compilation
        run: |
          echo "Validating system integrity across application packages..."
          python -m compileall gateway adapters intelligence benchmark tests

      - name: Run Full Regression Suite
        env:
          NEBIUS_API_KEY: "mock_nebius_key"
          TAVILY_API_KEY: "mock_tavily_key"
          FIREWALL_ENV: "production_verification"
          FAIL_CLOSED: "true"
        run: |
          pytest tests/ -v

      - name: Verify Dashboard Assets
        run: |
          echo "Verifying dashboard assets exist and are valid..."
          test -f dashboard/index.html || exit 1
          echo "Dashboard entrypoint verified."

      - name: Deployment Status Summary
        run: |
          echo "### 🚀 TrustLine Deployment Status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: main" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Integrity Check: Passed ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: Production Build Verified. Ready for Hackathon Demonstration." >> "$GITHUB_STEP_SUMMARY"
