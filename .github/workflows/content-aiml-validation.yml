name: AI/ML & Threat Intel Validation

on:
  pull_request:
    paths:
      - "intelligence/**"
      - "benchmark/**"
      - "tests/aiml/**"
      - "docs/**"
      - ".github/workflows/content-aiml-validation.yml"
  push:
    branches: [ main ]
    paths:
      - "intelligence/**"
      - "benchmark/**"
      - "tests/aiml/**"
      - "docs/**"
  workflow_dispatch:

jobs:
  validate-aiml:
    name: Nemotron Prompts & Threat Intel Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Nemotron & Tavily JSON Schemas
        run: |
          echo "Validating AI/ML schemas and attack payload datasets..."
          python -m compileall intelligence/ benchmark/

      - name: Run AI/ML Pytest Suite (Mocks & Invariants)
        env:
          NEBIUS_API_KEY: "mock_nebius_key"
          TAVILY_API_KEY: "mock_tavily_key"
          FIREWALL_ENV: "testing"
        run: |
          pytest tests/aiml/ -v
