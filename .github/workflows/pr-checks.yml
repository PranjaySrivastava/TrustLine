name: PR Checks - Master Gate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  master-pr-gate:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scan for Exposed Keys (.env / Secrets)
        run: |
          echo "Scanning for accidental secret commits..."
          if grep -rEi "nvapi-[a-zA-Z0-9]{30,}|tvly-[a-zA-Z0-9]{30,}" . --exclude-dir={.git,docs}; then
            echo "::error::Detected potential hardcoded Nebius or Tavily API key in repository files!"
            exit 1
          else
            echo "No exposed API keys found."
          fi

      - name: Code Quality & Syntax Check (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=docs,.git,__pycache__

      - name: Run Master Pytest Suite
        env:
          NEBIUS_API_KEY: "mock_nebius_key_for_ci"
          TAVILY_API_KEY: "mock_tavily_key_for_ci"
          FIREWALL_ENV: "testing"
          FAIL_CLOSED: "true"
        run: |
          pytest tests/ -v
